    {id:0,name:'Das Lagezentrum',short:'Lagezentrum',theme:'Unternehmen & Entscheidungen',desc:'Die Aufträge bleiben aus. Findet heraus, wofür Unternehmen da sind und welche Entscheidungen den Betrieb retten können.',topic:'Funktionen, Konkurrenz und Zielkonflikte',source:'Unterrichtsmaterial; Lernzettel 1 und 5',key:7,keyLabel:'Leitung',code:'583',order:[1,2,0],clue:'Die WAAGE steht nicht am Rand. Die MAPPE steht rechts vom RADAR.',cluePos:[79,61],spots:[[30,60],[65,31],[47,77]],objects:['Auftragsmappe','Konkurrenzradar','Entscheidungswaage'],symbols:['Mappe','Radar','Waage'],digits:[3,5,8],tasks:[
      {title:'Wozu gibt es Unternehmen?',kind:'multi',story:'Auf dem Schreibtisch liegt der Gründungsauftrag von NOVA. Vier Aussagen sind lesbar. Welche gehören in das Unternehmensprofil?',question:'Markiert alle zutreffenden Aussagen.',options:['Unternehmen stellen Güter her oder bieten Dienstleistungen an.','Nur private Haushalte können Abnehmer sein.','Unternehmen führen Produktionsfaktoren zusammen und organisieren Abläufe.','Gewinn ist in der Regel der Hauptzweck eines Unternehmens.'],answer:[0,2,3],explanation:'Unternehmen bieten Güter oder Dienstleistungen an und organisieren dafür Produktionsfaktoren. Zu ihren Abnehmern gehören auch andere Unternehmen und der Staat. Der Hauptzweck ist in der Regel Gewinn: das erwerbswirtschaftliche Prinzip.',wrong:'Prüft besonders, wer alles Produkte nachfragen kann. Und: Was muss ein Unternehmen für seine Leistung organisieren?',hints:['Denkt an Produkte, Organisation und das erwerbswirtschaftliche Prinzip.','Auch der Staat und andere Unternehmen können Abnehmer sein.','Richtig sind die Aussagen 1, 3 und 4.']},
      {title:'Unter Druck am Markt',kind:'multi',story:'Ein Konkurrenzunternehmen bietet ähnliche Produkte an. Gleichzeitig sinkt die Nachfrage nach den Produkten von NOVA. Im Radar erscheinen vier Meldungen.',question:'Welche zwei Meldungen beschreiben die Situation fachlich richtig?',options:['Das neue Konkurrenzunternehmen senkt automatisch die eigenen Produktionskosten von NOVA.','NOVA muss bei der Preisgestaltung eigene Kosten, Kundenreaktionen und Konkurrenz berücksichtigen.','Private Unternehmen haben einen Bestandsschutz, auch wenn ihre Produkte nicht nachgefragt werden.','Bleibt NOVA dauerhaft erfolglos, kann es vom Markt verschwinden.'],answer:[1,3],explanation:'Konkurrenz beeinflusst den Spielraum bei Preisen, verändert aber nicht automatisch die eigenen Kosten. Private Unternehmen haben keinen Bestandsschutz. Fehlende Nachfrage und dauerhafte Verluste gefährden ihre Existenz.',wrong:'Unterscheidet zwischen dem Preisspielraum und den eigenen Kosten. Besteht für private Unternehmen eine Überlebensgarantie?',hints:['Im Material steht: Private Unternehmen haben keinen Bestandsschutz.','Konkurrenz verändert den Preisspielraum. Die eigenen Kosten sinken dadurch nicht automatisch.','Markiert die Aussagen 2 und 4.']},
      {title:'Eine Entscheidung mit Folgen',kind:'choice',story:'NOVA könnte umweltschonender produzieren. Im Fallbeispiel kostet das zunächst mehr Geld und verringert bei gleichem Umsatz den Gewinn.',question:'Welche Erklärung trifft den Zielkonflikt?',options:['Es besteht kein Zielkonflikt, weil Unternehmen nur ein einziges Ziel verfolgen.','Mehr Umweltschutz und ein möglichst hoher kurzfristiger Gewinn lassen sich hier nicht vollständig gleichzeitig erreichen.','Umweltschutz erhöht grundsätzlich immer sofort den Gewinn.'],answer:1,explanation:'Ein Zielkonflikt liegt vor, wenn sich Ziele nicht vollständig miteinander vereinbaren lassen. Hier konkurrieren Umweltschutz und kurzfristiger Gewinn. Auch die Interessen der Menschen im Unternehmen spielen neben Gewinnzielen eine Rolle.',wrong:'Nennt gedanklich beide Ziele. Was passiert mit dem einen Ziel, wenn NOVA das andere stärker verfolgt?',hints:['Ein Zielkonflikt bedeutet: Zwei Ziele stehen sich in einer konkreten Situation entgegen.','Hier sind die Ziele Umweltschutz und hoher kurzfristiger Gewinn.','Die zweite Antwort erklärt beide Ziele und ihren Gegensatz.']}
    ]},
    {id:1,name:'Die Werkhalle',short:'Werkhalle',theme:'Produktionsfaktoren & Organisation',desc:'Die Maschinen stehen still. Bringt Ressourcen, Zuständigkeiten und Investitionspläne wieder zusammen.',topic:'Produktionsfaktoren, Funktionsbereiche und Investitionen',source:'Unterrichtsmaterial; Lernzettel 2–3',key:4,keyLabel:'Produktion',code:'692',order:[2,0,1],clue:'Der BAUPLAN liegt ganz rechts. Das MATERIAL folgt unmittelbar auf den SPIND.',cluePos:[83,76],spots:[[29,65],[64,28],[73,57]],objects:['Materialkisten','Organisationsplan','Investitionsspind'],symbols:['Material','Bauplan','Spind'],digits:[9,2,6],tasks:[
      {title:'Was braucht die Produktion?',kind:'match',story:'NOVA produziert Schreibtische. Auf den Lieferetiketten fehlen die Kategorien. Ordnet jedes Beispiel seinem Produktionsfaktor zu.',question:'Wählt zu jedem Beispiel den passenden Produktionsfaktor.',options:['Know-how','Betriebsmittel','Geld / Kapital','Arbeitskräfte','Werkstoffe'],rows:['Die Arbeitsleistung der Tischlerin','Das Holz für die Tischplatten','Die Sägemaschine in der Werkhalle','Das Wissen über eine präzise Holzverbindung','Die Geldmittel für die Betriebserweiterung'],answer:[3,4,1,0,2],explanation:'Arbeitskräfte leisten die menschliche Arbeit. Werkstoffe werden verarbeitet. Betriebsmittel wie Maschinen ermöglichen die Herstellung. Know-how ist Wissen und Können. Geld beziehungsweise Kapital wird etwa für die Eröffnung oder Erweiterung benötigt.',wrong:'Fragt bei jedem Beispiel: Wird es verarbeitet, hilft es bei der Herstellung oder ist es menschliche Leistung, Wissen oder Geld?',hints:['Werkstoffe werden verarbeitet. Betriebsmittel sind beispielsweise Maschinen oder Werkzeuge.','Tischlerin → Arbeitskräfte; Holz → Werkstoffe; Säge → Betriebsmittel.','Von oben: Arbeitskräfte, Werkstoffe, Betriebsmittel, Know-how, Geld / Kapital.']},
      {title:'Das Haus des Unternehmens',kind:'match',story:'Auf dem Bauplan fehlen die Zuständigkeiten. Nur wenn alle Bereiche zusammenarbeiten, läuft der Betrieb wieder an.',question:'Ordnet jeder Aufgabe den passenden Funktionsbereich zu.',options:['Absatz','Personalwesen','Unternehmensführung & Organisation','Produktion','Finanzen & Investment','Beschaffung & Materialwirtschaft','Rechnungswesen & Controlling'],rows:['Gesamtbetrieb planen, steuern und überwachen','Geld beschaffen und Investitionen planen','Neue Mitarbeiter einstellen','Kosten erfassen und Zahlen kontrollieren','Holz einkaufen und lagern','Schreibtische herstellen','Schreibtische bewerben und verkaufen'],answer:[2,4,1,6,5,3,0],explanation:'Die Unternehmensführung bildet das Dach: Sie plant und steuert den gesamten Betrieb. Die sechs Funktionsbereiche greifen ineinander. Im Material steht unter dem Haus das Unternehmensumfeld, mit dem der Betrieb in Wechselwirkung steht.',wrong:'Unterscheidet besonders Finanzen (Geld beschaffen) von Rechnungswesen (Kosten und Zahlen kontrollieren).',hints:['Das Dach steuert alle Bereiche. Einkauf, Herstellung und Verkauf sind verschiedene Aufgaben.','Geld beschaffen gehört zu Finanzen; Kosten kontrollieren zum Rechnungswesen.','Von oben: Unternehmensführung, Finanzen, Personalwesen, Rechnungswesen, Beschaffung, Produktion, Absatz.']},
      {title:'Geld für die Zukunft',kind:'multi',story:'Im Spind liegt ein Plan: NOVA will eine neue Maschine anschaffen, die die Leistungsfähigkeit langfristig erweitert.',question:'Welche Aussagen über diese Investition treffen zu?',options:['Die neue Maschine ist eine Investition, weil Geld langfristig zur Erweiterung der Leistungsfähigkeit eingesetzt wird.','Die Investition kann durch einen Kredit finanziert werden.','Geldgeber können sich zur Finanzierung am Unternehmen beteiligen.','Jede Investition garantiert, dass es künftig keine Verluste mehr gibt.'],answer:[0,1,2],explanation:'Investitionen dienen langfristig dazu, die Leistungsfähigkeit zu erhalten oder zu erweitern. Kredite und Beteiligungen von Geldgebern sind mögliche Finanzierungswege. Wirtschaftlicher Erfolg bleibt unsicher.',wrong:'Trennt den Zweck der Investition von einer angeblichen Erfolgsgarantie. Welche beiden Finanzierungswege nennt das Material?',hints:['Sucht in der Wissensakte nach dem Begriff Investition.','Investitionen können über Kredite oder Beteiligungen finanziert werden. Eine Gewinngarantie gibt es nicht.','Die ersten drei Aussagen sind richtig.']}
    ]},
    {id:2,name:'Die Marktpassage',short:'Marktpassage',theme:'Güterstrom & Geldstrom',desc:'Lieferungen und Zahlungen wurden vertauscht. Rekonstruiert die Wege durch das Unternehmen und prüft das Betriebsergebnis.',topic:'Beschaffungsmarkt, Absatzmarkt, Umsatz und Gewinn',source:'Unterrichtsmaterial; Lernzettel 4–5',key:2,keyLabel:'Beschaffung',code:'471',order:[1,0,2],clue:'Das FÖRDERBAND liegt zwischen den beiden anderen Karten. Die KASSE steht links vom RECHNER.',cluePos:[19,76],spots:[[44,62],[72,47],[31,27]],objects:['Förderband','Zahlungskasse','Gewinnrechner'],symbols:['Förderband','Kasse','Rechner'],digits:[7,4,1],tasks:[
      {title:'Den Güterstrom reparieren',kind:'order',story:'Die Steuerung des Förderbands hat ihre Reihenfolge verloren. Verbindet die Stationen vom Einkauf bis zum Verkauf. Danach erreichen die Endprodukte die Abnehmer.',question:'Bringt die fünf Stationen mit den Pfeiltasten in die richtige Reihenfolge.',items:['Absatz','Lager für fertige Produkte','Beschaffung','Produktion','Lager für eingekaufte Werkstoffe'],answer:[2,4,3,1,0],explanation:'Der Güterstrom verläuft von der Beschaffung über das erste Lager zur Produktion. Danach folgen das Lager für fertige Produkte und der Absatz. So werden Produktionsfaktoren zu Endprodukten verarbeitet: Im Betrieb entsteht Wertschöpfung.',wrong:'Startet mit dem Einkauf. Vor und nach der Produktion gibt es jeweils ein Lager.',hints:['Am Anfang steht die Beschaffung, am Ende der Absatz.','Eingekaufte Werkstoffe lagern vor der Produktion. Fertige Produkte lagern danach.','Beschaffung → Lager für eingekaufte Werkstoffe → Produktion → Lager für fertige Produkte → Absatz.']},
      {title:'Zwei Märkte, zwei Geldwege',kind:'match',story:'In der Kasse liegen vier falsch abgelegte Belege. Ordnet sie den richtigen Begriffen zu. Betrachtet alle Vorgänge aus der Sicht von NOVA.',question:'Welcher Begriff gehört zu welchem Vorgang?',options:['Umsatz / Einzahlung','Absatzmarkt','Kosten / Auszahlung','Beschaffungsmarkt'],rows:['NOVA kauft Holz und eine neue Maschine ein: Auf welchem Markt?','NOVA verkauft seine Schreibtische: Auf welchem Markt?','Geld fließt für verkaufte Schreibtische von Kunden an NOVA.','NOVA bezahlt Lieferanten für Produktionsfaktoren.'],answer:[3,1,0,2],explanation:'Auf dem Beschaffungsmarkt kauft NOVA Produktionsfaktoren; auf dem Absatzmarkt verkauft es Endprodukte. Im Modell des Materials stehen Auszahlungen für Produktionsfaktoren für Kosten und Einzahlungen für verkaufte Produkte für Umsatz. Güter und die dazugehörige Bezahlung fließen in entgegengesetzte Richtungen.',wrong:'Achtet auf die Perspektive: Kommt Geld bei NOVA an oder verlässt es NOVA? Werden Faktoren eingekauft oder Endprodukte verkauft?',hints:['Beschaffung bedeutet einkaufen. Absatz bedeutet verkaufen.','Kundenzahlungen kommen bei NOVA an. Lieferantenzahlungen gehen von NOVA weg.','Von oben: Beschaffungsmarkt, Absatzmarkt, Umsatz / Einzahlung, Kosten / Auszahlung.']},
      {title:'Was bleibt tatsächlich übrig?',kind:'number',story:'Die Abrechnung eines vereinfachten Monats: NOVA erzielt 12.000 € Umsatz. Die gesamten Kosten betragen 9.000 €. Der Rechner zeigt den Umsatz als Gewinn an – das kann nicht stimmen.',question:'Wie hoch ist der Gewinn in Euro? Gebt die Zahl ohne Tausendertrennzeichen ein.',answer:3000,unit:'€ Gewinn',explanation:'Gewinn = Umsatz − Kosten. 12.000 € − 9.000 € = 3.000 €. Umsatz ist die Einnahme aus verkauften Produkten; erst nach Abzug der Kosten ergibt sich der Gewinn. Dauerhafte Verluste gefährden die Existenz.',wrong:'Der Umsatz ist noch nicht der Gewinn. Zieht die gesamten Kosten vom Umsatz ab.',hints:['Die Formel steht in der Wissensakte unter Märkte & Geld.','Rechnet 12.000 minus 9.000.','Der Gewinn beträgt 3000 Euro.']}
    ]},
    {id:3,name:'Das Gründerarchiv',short:'Gründerarchiv',theme:'Rechtsformen & begründete Entscheidungen',desc:'Die Gründungsakte ist verschlüsselt. Vergleicht Unternehmensformen, prüft einen Gründungsfall und lest die Beschäftigtengrafik richtig.',topic:'Rechtsformen, Haftung und Unternehmensstruktur',source:'Unterrichtsmaterial; Lernzettel 6–9',key:9,keyLabel:'Absatz',code:'825',order:[2,1,0],clue:'Die GRÜNDUNG steht nicht am Rand. Die STATISTIK steht links vom REGISTER.',cluePos:[55,43],spots:[[26,40],[51,71],[75,32]],objects:['Rechtsformregister','Gründungsakte','Statistiktafel'],symbols:['Register','Gründung','Statistik'],digits:[5,2,8],tasks:[
      {title:'Fünf Akten, fünf Rechtsformen',kind:'match',story:'Die Registerkarten beschreiben die Unternehmensformen aus dem Material. Ordnet die passenden Namen zu.',question:'Welche Rechtsform passt jeweils zum vollständigen Steckbrief?',options:['AG','GbR','GmbH','Einzelunternehmen','OHG'],rows:['Eine Person gründet einfach und günstig; sie haftet auch mit ihrem Privatvermögen.','Mindestens zwei Personen schließen sich z. B. zu einer ärztlichen Gemeinschaftspraxis zusammen.','Eine Personengesellschaft für die Ausübung eines Handelsgewerbes.','Kapitalgesellschaft mit 25.000 € Stammkapital und aufwändiger Gründung.','Kapitalgesellschaft mit 50.000 € Grundkapital, Aktien, Vorstand und Aufsichtsrat.'],answer:[3,1,4,2,0],explanation:'Einzelunternehmen werden von einer Person gegründet. GbR und OHG sind Personengesellschaften; die OHG betreibt ein Handelsgewerbe. GmbH und AG sind Kapitalgesellschaften. Die Materialien nennen 25.000 € Stammkapital für die GmbH und 50.000 € Grundkapital für die AG. Nach der vereinfachten Darstellung haftet bei Einzelunternehmen und Personengesellschaften auch das Privatvermögen, bei GmbH und AG das Gesellschaftsvermögen.',wrong:'Die Kapitalbeträge unterscheiden GmbH und AG. Eine ärztliche Gemeinschaftspraxis ist im Material das Beispiel für eine GbR.',hints:['Es gibt ein Einzelunternehmen, zwei Personen- und zwei Kapitalgesellschaften.','GmbH: 25.000 € Stammkapital. AG: 50.000 € Grundkapital und Aktien.','Von oben: Einzelunternehmen, GbR, OHG, GmbH, AG.']},
      {title:'Welche Form passt zu NOVA?',kind:'choice',story:'Zwei Gründerinnen haben eine risikoreiche Geschäftsidee und 30.000 € Startkapital. Sie wollen ihr Privatvermögen nach dem Modell im Material schützen und nehmen eine aufwändigere Gründung in Kauf.',question:'Welche Empfehlung ist mit den Angaben am besten begründet?',options:['GbR, weil die Gesellschafterinnen dort grundsätzlich nicht mit ihrem Privatvermögen haften.','AG, weil 30.000 € das im Material genannte Grundkapital vollständig abdecken.','GmbH, weil die Haftungsbeschränkung zum Risiko passt und 30.000 € die genannten 25.000 € Stammkapital abdecken; der höhere Gründungsaufwand muss berücksichtigt werden.','Einzelunternehmen, weil diese Rechtsform für eine gemeinsame Gründung durch zwei Personen gedacht ist.'],answer:2,explanation:'Unter den genannten Kriterien passt die GmbH: beschränkte Haftung und 25.000 € Stammkapital. Die AG verlangt im Material 50.000 € Grundkapital. Eine GbR schützt das Privatvermögen nicht entsprechend. Generell zählen bei der Wahl Team, Risiko, Kapital, Aufwand und gewünschte Geschwindigkeit. Gründungs- und laufende Kosten müssen zusätzlich geplant werden.',wrong:'Vergleicht gleichzeitig Teamgröße, Haftung, Mindestkapital und akzeptierten Aufwand. Eine Begründung muss alle Angaben des Falls beachten.',hints:['Das Privatvermögen soll nach dem Material geschützt werden: Schaut auf die Kapitalgesellschaften.','30.000 € reichen für die genannten 25.000 €, aber nicht für 50.000 € Mindestkapital.','Die dritte Antwort empfiehlt die GmbH und begründet die Abwägung.']},
      {title:'Die Grafik richtig lesen',kind:'multi',story:'Die Statistiktafel zeigt die Grafik „Große und kleine Arbeitgeber“ als Tabelle: Von je 100 Beschäftigten arbeiten so viele in den folgenden Betriebsgrößen. Stand: Mitte 2017; Ost einschließlich Berlin; rundungsbedingte Differenzen.',table:true,question:'Welche zwei Aussagen lassen sich aus diesen Daten ableiten?',options:['Im Westen arbeiten 23 von 100 Beschäftigten in Großbetrieben.','23 % aller Unternehmen im Westen sind Großbetriebe.','Im Osten arbeiten 29 von 100 Beschäftigten in kleineren mittelständischen Betrieben.','Die Grafik zeigt, welchen Umsatz die Betriebsgrößen erzielen.'],answer:[0,2],explanation:'Die Grafik zeigt Anteile von Beschäftigten nach Betriebsgröße. Sie zeigt weder die Zahl der Unternehmen noch Umsatzanteile. Im Westen sind 23 von 100 Beschäftigten in Großbetrieben; im Osten 29 von 100 in kleineren mittelständischen Betrieben tätig. Die historischen Daten beschreiben den Stand Mitte 2017.',wrong:'Lest die Bezugsgröße genau: Geht es um Beschäftigte, um Unternehmen oder um Umsatz?',hints:['Entscheidend ist die Überschrift: „Von je 100 Beschäftigten“.','Die Zahlen sind Beschäftigtenanteile. Über Unternehmensanzahl oder Umsatz geben sie keine Auskunft.','Richtig sind die Aussagen 1 und 3.']}
    ]}
  ];

  const BOOK=[
    {name:'Unternehmen',html:`<h3>Wofür Unternehmen da sind</h3><p>Unternehmen stellen Güter her oder bieten Dienstleistungen an. Ihre Abnehmer sind private Haushalte, andere Unternehmen und der Staat. Dazu führen sie Produktionsfaktoren zusammen und planen und organisieren die Abläufe.</p><p>Der Hauptzweck ist in der Regel der Gewinn: Wer Arbeit oder Geld einsetzt, erwartet einen darüber hinausgehenden Ertrag. Das heißt <strong>erwerbswirtschaftliches Prinzip</strong>.</p><h3>Entscheiden unter Unsicherheit</h3><p>Private Unternehmen haben <strong>keinen Bestandsschutz</strong>. Fehlen Nachfrage und wirtschaftlicher Erfolg dauerhaft, kann ein Unternehmen vom Markt verschwinden.</p><p>Preise hängen von eigenen Kosten, Konkurrenz und Kundenreaktionen ab. Konkurrenzunternehmen bieten gleiche oder ähnliche Produkte an. Konkurrenz verändert den Preisspielraum, aber nicht automatisch die eigenen Kosten. Kosten betreffen Hersteller und Dienstleister ebenso wie kleine und große Unternehmen.</p><h3>Ziele können sich widersprechen</h3><p>Unternehmen verfolgen auch Ziele, die Menschen und Umwelt betreffen. Ein <strong>Zielkonflikt</strong> entsteht, wenn sich Ziele nicht vollständig gleichzeitig erreichen lassen – etwa wenn umweltschonendere Produktion zunächst mehr kostet und bei gleichem Umsatz den kurzfristigen Gewinn mindert.</p>`},
    {name:'Produktion',html:`<h3>Die Produktionsfaktoren</h3><ul><li><strong>Arbeitskräfte:</strong> menschliche Arbeitsleistung.</li><li><strong>Werkstoffe:</strong> Roh- und Hilfsstoffe sowie Verbrauchsmaterial, die verarbeitet werden.</li><li><strong>Betriebsmittel:</strong> Maschinen, Werkzeuge, Büros und Transportmittel.</li><li><strong>Geld / Kapital:</strong> Mittel für Eröffnung, Modernisierung oder Erweiterung.</li><li><strong>Know-how:</strong> Wissen und Können im Unternehmen.</li></ul><h3>Das Haus des Unternehmens</h3><p>Das Dach ist die <strong>Unternehmensführung & Organisation</strong>: Sie plant, entscheidet, steuert und kontrolliert.</p><ul><li><strong>Finanzen & Investment:</strong> Geld beschaffen, Investitionen planen.</li><li><strong>Personalwesen:</strong> Personal einstellen, bezahlen und schulen.</li><li><strong>Rechnungswesen & Controlling:</strong> Kosten erfassen, Zahlen kontrollieren.</li><li><strong>Beschaffung & Materialwirtschaft:</strong> Rohstoffe einkaufen und lagern.</li><li><strong>Produktion:</strong> Güter herstellen, Dienstleistungen erbringen.</li><li><strong>Absatz:</strong> verkaufen, werben und vertreiben.</li></ul><p>Lieferanten liefern den Input; Abnehmer erhalten den Output. Unter dem Haus zeigt die Grafik das <strong>Unternehmensumfeld</strong>. Das Unternehmen steht mit ihm in Wechselwirkung. Alle Funktionsbereiche greifen ineinander.</p><h3>Investition</h3><p>Eine Investition ist der langfristige Einsatz von Geldmitteln, um die Leistungsfähigkeit zu erhalten oder zu erweitern. Sie kann etwa über <strong>Kredite</strong> oder <strong>Beteiligungen von Geldgebern</strong> finanziert werden.</p>`},
    {name:'Märkte & Geld',html:`<h3>Zwischen zwei Märkten</h3><p>Auf dem <strong>Beschaffungsmarkt</strong> kauft das Unternehmen seine Produktionsfaktoren ein. Auf dem <strong>Absatzmarkt</strong> verkauft es seine Endprodukte.</p><p class="flow"><strong>Güterstrom</strong><br>Beschaffung → Lager → Produktion → Lager → Absatz → Endprodukte bei den Abnehmern</p><p>Durch die Verarbeitung der Produktionsfaktoren entstehen Endprodukte. Damit schafft das Unternehmen Wert. Die Unternehmensleitung steuert und überwacht die Abläufe.</p><h3>Das Geld fließt dagegen</h3><p>Kunden bezahlen das Unternehmen für die verkauften Produkte: Im Modell des Materials sind das <strong>Einzahlungen / Umsatz</strong>. Das Unternehmen bezahlt Lieferanten für Produktionsfaktoren: Im Modell des Materials sind das <strong>Auszahlungen / Kosten</strong>. Güter und ihre Bezahlung fließen jeweils in entgegengesetzte Richtungen.</p><p class="flow"><strong>Gewinn = Umsatz − Kosten</strong></p><p>Umsatz allein sagt noch nichts über den Gewinn. Sind die Kosten dauerhaft höher als der Umsatz, gefährden die Verluste die Existenz.</p>`},
    {name:'Rechtsformen',html:`<h3>Fünf Fragen vor der Gründung</h3><ol><li>Allein oder im Team?</li><li>Wie risikoreich ist die Geschäftsidee?</li><li>Wie viel Startkapital steht zur Verfügung?</li><li>Wie viel bürokratischer Aufwand ist gewollt?</li><li>Wie schnell soll das Unternehmen starten?</li></ol><p>Die Antworten beeinflussen die passende Rechtsform. Steuer- und Unternehmensberatung kann bei der Entscheidung helfen.</p><h3>Rechtsformen im Vergleich</h3><div class="wide-table"><table class="data-table"><thead><tr><th>Form</th><th>Gründung / Besonderheit</th><th>Mindestkapital</th><th>Haftung im Material</th></tr></thead><tbody><tr><td>Einzelunternehmen</td><td>Eine Person; einfach, schnell, günstig</td><td>Keines</td><td>Auch Privatvermögen</td></tr><tr><td>GbR</td><td>Ab zwei Personen; z. B. Gemeinschaftspraxis</td><td>Keines</td><td>Gesellschafter persönlich</td></tr><tr><td>OHG</td><td>Personengesellschaft; Handelsgewerbe</td><td>Keines</td><td>Gesellschafter persönlich</td></tr><tr><td>GmbH</td><td>Aufwändig, zeit- und kostenintensiv</td><td>25.000 € Stammkapital</td><td>Gesellschaftsvermögen</td></tr><tr><td>AG</td><td>Sehr formell; Aktien, Vorstand, Aufsichtsrat</td><td>50.000 € Grundkapital</td><td>Gesellschaftsvermögen</td></tr></tbody></table></div><p>Einzelunternehmen sind beispielsweise bei Freiberuflern und Kleingewerbetreibenden verbreitet. Freiberufler melden sich laut Material beim Finanzamt; Gewerbetreibende benötigen zusätzlich einen Gewerbeschein.</p><p>Für GbR und OHG ist nach der Darstellung im Material ein Gesellschaftsvertrag erforderlich, grundsätzlich ohne notarielle Beurkundung und nicht zwingend schriftlich. Bei der AG nennt das Material einen notariell beglaubigten Gesellschaftsvertrag.</p><p><strong>Stammkapital</strong> ist die im Gesellschaftsvertrag vereinbarte Summe der Einlagen der Gesellschafter einer GmbH.</p><p>Bei der Wahl der Rechtsform muss man Haftung, Kapitalbedarf und Gründungsaufwand gegeneinander abwägen. Die Tabelle gibt die vereinfachte Darstellung der vorgelegten Lernmaterialien wieder.</p>`},
    {name:'Grafik & Klausur',html:`<h3>Große und kleine Arbeitgeber</h3><p>Die Unternehmenslandschaft umfasst kleine Betriebe und große Konzerne. Die Grafik im Material zeigt <strong>Beschäftigtenanteile</strong> nach Betriebsgröße, keine Unternehmenszahlen oder Umsatzanteile.</p>${STAT_TABLE}<h3>So wird aus Wissen eine Erklärung</h3><p><strong>Fachbegriff nennen → in eigenen Worten erklären → am Beispiel oder Material belegen.</strong></p><p>Bei einer begründeten Entscheidung nennt ihr passende Kriterien, wendet sie auf den Fall an und wägt Vor- und Nachteile ab. „Ich würde die GmbH wählen“ allein ist noch keine Begründung.</p><h3>Materialgrundlage</h3><p>Das Unterrichtsmaterial zu Unternehmen und Rechtsformen, ergänzend der bereitgestellte „Lernzettel · 1. Das Unternehmen“. Die Spielhandlung und NOVA-Fälle sind erfunden; das benötigte Fachwissen stammt aus diesen Materialien.</p>`}
  ];
  const REFLECTIONS=[
    {q:'Erläutert, wie Konkurrenz die Preisgestaltung von NOVA beeinflusst. Bezieht die eigenen Kosten und die Kunden ein.',model:'Konkurrenzunternehmen bieten gleiche oder ähnliche Produkte an. NOVA muss bei seinen Preisen beachten, welche Alternativen die Kunden haben und wie sie auf einen Preis reagieren. Zugleich müssen die eigenen Kosten berücksichtigt werden. Wenn andere Anbieter günstiger verkaufen, kann NOVA nicht beliebig hohe Preise verlangen. Die eigenen Kosten sinken durch die Konkurrenz aber nicht automatisch.',check:'Unsere Erklärung verbindet Konkurrenz, Kundenreaktionen und eigene Kosten mit einem Beispiel.'},
    {q:'Empfehlt für zwei Gründerinnen mit risikoreicher Idee und 30.000 € Startkapital eine Rechtsform. Sie möchten ihr Privatvermögen nach dem Material schützen. Begründet und nennt einen Nachteil.',model:'Die GmbH passt im Modell des Materials: Sie beschränkt die Haftung auf das Gesellschaftsvermögen. Das ist bei der risikoreichen Idee ein Vorteil. Die genannten 25.000 € Stammkapital liegen unter 30.000 €. Eine AG verlangt dagegen 50.000 € Grundkapital; bei einer GbR haften die Gesellschafterinnen persönlich. Ein Nachteil der GmbH ist die zeit- und kostenintensive Gründung. Neben dem Stammkapital müssen weitere Kosten eingeplant werden.',check:'Wir begründen mit Haftung und Kapital und nennen einen Nachteil oder eine begründete Abgrenzung.'},
    {q:'Erklärt am Weg vom eingekauften Holz zum verkauften Schreibtisch den Güterstrom, die Wertschöpfung und die entgegengesetzten Zahlungen.',model:'NOVA kauft Holz auf dem Beschaffungsmarkt und lagert es. In der Produktion wird daraus mit Arbeitskräften, Betriebsmitteln und Know-how ein Schreibtisch: Durch diese Verarbeitung entsteht Wertschöpfung. Nach dem Lager für Fertigprodukte wird der Schreibtisch auf dem Absatzmarkt verkauft. Das Produkt geht an den Kunden, dessen Bezahlung geht an NOVA (Umsatz). Beim Einkauf geht Holz von den Lieferanten zu NOVA und die Bezahlung von NOVA zu den Lieferanten (im Modell des Materials Kosten). Die Unternehmensleitung steuert die Abläufe.',check:'Wir nennen beide Märkte, erklären die Verarbeitung und beschreiben beide Zahlungsrichtungen.'}

  const euro = value => new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(value);
  let pickedToken=null, pointerDrag=null, dragFrame=0, suppressPuzzleClickUntil=0;

  function upgradePuzzles(s) {
    const previous=s.mechanics!==2;
    const matrix=(v,rows,cols)=>Array.isArray(v)&&v.length===rows&&v.every(a=>Array.isArray(a)&&a.length===cols);
    if(previous||!matrix(s.fragments,4,2))s.fragments=s.clues.map(found=>[!!found,!!found]);
    if(previous||!matrix(s.doorSlots,4,3))s.doorSlots=ROOMS.map((r,i)=>s.unlocked[i]?[...r.order]:[-1,-1,-1]);
    if(!Array.isArray(s.vaultSlots)||s.vaultSlots.length!==4)s.vaultSlots=s.vaultOpen?[2,1,3,0]:[-1,-1,-1,-1];
    if(!Array.isArray(s.lockHints)||s.lockHints.length!==4)s.lockHints=[0,0,0,0];
    if(typeof s.motion!=='boolean')s.motion=true;
    s.clues=s.fragments.map(a=>a.every(Boolean));
    s.mechanics=2;
    return s;
  }

  function puzzleInfo(id) {
    const [kind,rs,ts]=id.split(':'),r=Number(rs),t=Number(ts);
    if(kind==='door')return {kind,id,r,labels:ROOMS[r].symbols,details:ROOMS[r].digits.map(String),available:state.solved[r],values:state.doorSlots[r],slots:['1 · links','2 · Mitte','3 · rechts'],locked:state.unlocked[r]};
    if(kind==='vault')return {kind,id,labels:ROOMS.map(x=>x.keyLabel),details:ROOMS.map(x=>String(x.key)),available:state.unlocked,values:state.vaultSlots,slots:['1 · Start des Güterwegs','2 · nächster Bereich','3 · letzter Bereich','4 · das Dach'],locked:state.vaultOpen};
    const task=ROOMS[r].tasks[t];
    if(kind==='ledger')return {kind,id,r,t,labels:RECEIPTS.map(x=>x.label),details:RECEIPTS.map(x=>euro(x.amount)),values:getDraft(r,t).groups,slots:['Umsatz · Geld aus Verkäufen','Kosten · für die Leistungserstellung'],locked:state.solved[r][t]};
    return {kind,id,r,t,labels:kind==='house'?task.options:task.items,values:getDraft(r,t),slots:kind==='house'?task.rows:task.items.map((_,i)=>String(i+1).padStart(2,'0')),locked:state.solved[r][t]};
  }

  function dragToken(info,i) {
    const selected=pickedToken?.board===info.id&&pickedToken.token===i;
    const detail=info.details?.[i];
    return `<button type="button" class="drag-token ${selected?'is-selected':''}" data-action="pick-token" data-board-id="${info.id}" data-token="${i}" aria-pressed="${selected}" aria-label="${esc(info.labels[i])}${detail?', '+esc(detail):''} aufnehmen" ${info.locked?'disabled':''}><span class="token-copy">${detail?`<strong class="token-value">${esc(detail)}</strong>`:''}<span>${esc(info.labels[i])}</span>${info.kind==='ledger'?`<span class="token-detail">${esc(RECEIPTS[i].detail)}</span>`:''}</span><span class="drag-grip" aria-hidden="true">⠿</span></button>`;
  }

  function puzzleBoard(id) {
    const info=puzzleInfo(id),{kind,locked,values}=info;
    const bank=info.labels.map((_,i)=>i).filter(i=>(!info.available||info.available[i])&&(kind==='ledger'?values[i]===-1:!values.includes(i)));
    const showBank=kind!=='flow';
    return `<div class="puzzle-board ${kind==='house'?'house-board':kind==='flow'?'order-board':kind==='ledger'?'receipt-board':''}" data-board="${id}"><p class="board-instruction">${icon('rooms')}<span>${locked?'Kombination gesichert.':'Ziehen oder Karte wählen → Zielfeld antippen. Mit Tab und Enter geht es ebenfalls. Auf Touchscreens am Griff ⠿ ziehen.'}</span></p>${showBank?`<div class="token-bank" data-board-id="${id}" data-drop-slot="bank" role="group" aria-label="Kartenablage">${bank.map(i=>dragToken(info,i)).join('')||`<p class="bank-empty">${info.available?.some(x=>!x)?'Weitere Karten erhaltet ihr durch gelöste Rätsel.':'Alle Karten liegen in einem Fach.'}</p>`}</div>`:''}<div class="${kind==='house'?'house-grid':'drop-grid'}">${info.slots.map((label,i)=>{
      const tokens=kind==='ledger'?values.map((v,k)=>v===i?k:-1).filter(v=>v!==-1):values[i]===-1?[]:[values[i]];
      return `<div class="drop-slot" data-board-id="${id}" data-drop-slot="${i}"><button type="button" class="slot-label" data-action="place-token" data-board-id="${id}" data-slot="${i}" aria-label="Karte bei ${esc(label)} ablegen" ${locked?'disabled':''}>${esc(label)}</button>${tokens.map(k=>dragToken(info,k)).join('')||`<button type="button" class="empty-target" data-action="place-token" data-board-id="${id}" data-slot="${i}" aria-label="Karte bei ${esc(label)} ablegen" ${locked?'disabled':''}>${kind==='flow'?'–':'+ Hier ablegen'}</button>`}${kind==='flow'?`<span class="order-controls"><button type="button" class="icon-btn" data-action="flow-move" data-pos="${i}" data-direction="-1" ${locked||i===0?'disabled':''} aria-label="${esc(info.labels[values[i]])} nach oben">${icon('up')}</button><button type="button" class="icon-btn" data-action="flow-move" data-pos="${i}" data-direction="1" ${locked||i===values.length-1?'disabled':''} aria-label="${esc(info.labels[values[i]])} nach unten">${icon('down')}</button></span>`:''}${kind==='ledger'?`<output class="receipt-total" aria-label="Summe ${i===0?'Umsatz':'Kosten'}">${euro(tokens.reduce((sum,k)=>sum+RECEIPTS[k].amount,0))}</output>`:''}</div>`;
    }).join('')}</div>${kind==='house'?'<div class="house-foot">Unternehmensumfeld ↔ Unternehmen</div>':''}${kind==='flow'?`<div class="belt-preview ${locked?'is-running':''}" aria-hidden="true"><span class="belt-caption">${locked?'FÖRDERBAND LÄUFT':'STEUERUNG WARTET AUF TESTLAUF'}</span><div class="belt-package"></div><div class="belt-track"></div></div>`:''}${!locked?`<div class="board-tools"><button class="btn small" type="button" data-action="board-reset" data-board-id="${id}">${icon('refresh')} ${kind==='flow'?'Reihenfolge zurücksetzen':'Karten zurücklegen'}</button>${showBank?`<button type="button" class="btn small ghost" data-action="return-token" data-board-id="${id}">Gewählte Karte zurück in die Ablage</button>`:''}</div>`:''}<p class="board-status" role="status">${locked?'Gesichert.':kind==='flow'?'Eine Karte auf eine andere ziehen: Sie wird dort einsortiert.':kind==='ledger'?'Belege lassen sich jederzeit in das andere Fach verschieben.':'Belegte Fächer tauschen ihre Karten. Aus der Ablage ersetzt ihr eine Karte.'}</p></div>`;
  }

  function refreshPuzzle(id,target=-1) {
    const old=document.querySelector(`[data-board="${id}"]`);
    if(!old)return;
    const scroll=$('#modal').open?$('#modal').scrollTop:window.scrollY;
    old.outerHTML=puzzleBoard(id);
    const board=document.querySelector(`[data-board="${id}"]`);
    const slot=board.querySelector(`[data-drop-slot="${target}"]`);
    slot?.classList.add('just-placed');
    const focus=slot?.querySelector('.slot-label:not(:disabled)')||board.querySelector('.drag-token:not(:disabled),.board-tools button');
    focus?.focus({preventScroll:true});
    if($('#modal').open)$('#modal').scrollTop=scroll;
    else window.scrollTo(0,scroll);
    if(id.startsWith('door:'))updateLockDisplay(Number(id.split(':')[1]));
    if(id==='vault')updateLockDisplay(4);
  }

  function selectToken(board,token) {
    const info=puzzleInfo(board);
    if(info.locked)return;
    if(pickedToken?.board===board&&pickedToken.token===token)pickedToken=null;
    else pickedToken={board,token};
    document.querySelectorAll('.drag-token').forEach(el=>{const on=pickedToken?.board===el.dataset.boardId&&pickedToken.token===Number(el.dataset.token);el.classList.toggle('is-selected',on);el.setAttribute('aria-pressed',String(on))});
    announce(pickedToken?`${info.labels[token]} ausgewählt. Wählt jetzt das Zielfeld.`:'Auswahl aufgehoben.');
  }

  function placeToken(board,token,slot) {
    const info=puzzleInfo(board),v=info.values;
    if(info.locked||!Number.isInteger(token)||token<0||token>=info.labels.length||info.available&&!info.available[token])return;
    if(slot!=='bank'&&(!Number.isInteger(slot)||slot<0||slot>=info.slots.length))return;
    if(info.kind==='ledger')v[token]=slot==='bank'?-1:slot;
    else {
      const from=v.indexOf(token);
      if(info.kind==='flow'){
        if(slot==='bank'||from<0)return;
        v.splice(from,1);v.splice(slot,0,token);
      }else if(slot==='bank'){if(from>=0)v[from]=-1}
      else{const displaced=v[slot];if(from>=0)v[from]=displaced;v[slot]=token}
    }
    pickedToken=null;save();refreshPuzzle(board,slot);
    announce(`${info.labels[token]} ${slot==='bank'?'zurück in der Ablage.':'bei '+info.slots[slot]+' abgelegt.'}`);
  }

  function updateLockDisplay(r) {
    const values=r===4?state.vaultSlots:state.doorSlots[r];
    const out=document.querySelector(r===4?'#vault-code-display':`#door-code-display`);
    if(out)out.textContent=values.map(i=>i<0?'·':r===4?ROOMS[i].key:ROOMS[r].digits[i]).join('');
  }

  function fragmentList(r) {
    return `<ul class="fragment-list">${FRAGMENTS[r].map((text,i)=>`<li class="${state.fragments[r][i]?'':'missing'}"><span class="fragment-letter">${i===0?'A':'B'}</span><span>${state.fragments[r][i]?text:'Dieses Fragment fehlt noch.'}</span></li>`).join('')}</ul>`;
  }

  function combinationLock(r) {
    if(state.unlocked[r])return `<div class="lock-panel"><div><h3>${icon('unlock')} Tür geöffnet</h3><p>Die Kombination ist gesichert.</p></div><button class="btn primary small" data-action="room" data-room="${r+1}">Weiter ${icon('arrow')}</button></div>`;
    const room=ROOMS[r];
    return `<section class="logic-lock" aria-label="Kombinationsschloss"><span class="eyebrow">DAS KOMBINATIONSSCHLOSS</span><h3>Zwei Spuren. Eine Reihenfolge.</h3><p class="micro">Sammelt beide Notizfragmente. Kombiniert ihre Aussagen und ordnet eure drei Ziffernkarten von links nach rechts.</p><div class="lock-fragments">${fragmentList(r)}</div>${puzzleBoard('door:'+r)}<form id="door-form"><div class="lock-readout"><div><label class="eyebrow" for="door-code-display">EURE KOMBINATION</label><output id="door-code-display">${state.doorSlots[r].map(i=>i<0?'·':room.digits[i]).join('')}</output></div><button class="btn primary" type="submit">${icon('unlock')} Schloss prüfen</button></div></form><div class="task-actions" style="margin-top:12px"><button class="text-button micro" data-action="lock-hint">${icon('bulb')} Kombinationshilfe ${Math.min(state.lockHints[r]+1,2)}/2</button></div><div id="lock-hint">${lockHintHtml(r)}</div></section>`;
  }

  function lockHintHtml(r) {

    ][r];return `<svg viewBox="0 0 700 500" preserveAspectRatio="none" aria-hidden="true">${common}${art}${puzzleMotionArt(r)}</svg>`}
  function landing(){return `<main class="landing" id="main-content"><div class="hero"><div class="hero-copy"><span class="pill"><span class="dot"></span> EURE MISSION · 45 MINUTEN</span><h1>Die Firma steht still.<br><em>Ihr habt den<br>Schlüssel.</em></h1><p>Vier verschlossene Räume. Ein Unternehmen in der Krise. Kombiniert versteckte Spuren, setzt die Teile zusammen und bringt NOVA wieder auf Kurs.</p><div class="mission-meta"><span>${icon('clock')}45 Minuten</span><span>${icon('rooms')}4 Räume + Finale</span><span>${icon('users')}Allein oder im Team</span></div><div class="hero-actions"><button class="btn primary" data-action="setup">${state.started?'Mission fortsetzen':'Mission starten'} ${icon('arrow')}</button><button class="btn" data-action="help">So funktioniert’s</button></div><p class="micro">Eure Klausurvorbereitung in Politik-Wirtschaft · Jahrgang 10</p></div><div class="plan-card"><div class="plan-label"><span class="eyebrow">NOVA / BETRIEBSGELÄNDE</span><p>Vier Räume. Ein Weg zum Neustart.</p></div><span class="plan-stamp mono">VERTRAULICH</span>${buildingArt()}<div class="plan-foot mono"><span>GRUNDRISS 01—04</span><span>● ZUGANG GESPERRT</span></div></div></div><section class="landing-bottom" aria-label="Die vier Räume"><div class="section-label"><span class="eyebrow">DAS LIEGT VOR EUCH</span><span class="micro">Entdecken → verstehen → entschlüsseln</span></div><div class="room-previews">${ROOMS.map((r,i)=>`<div class="room-preview"><span>0${i+1}</span><div><h3>${r.name}</h3><p>${r.theme}</p></div></div>`).join('')}</div></section></main><footer class="landing-footer"><span>Wissen aus eurem Unterrichtsmaterial und Lernzettel.<br>Mit Hinweisen, Wissensakte und Klausurtraining.</span><div class="button-row">${state.started?'<button class="text-button" data-action="reset">Neu beginnen</button>':''}</div></footer>`}
  function sidebar(){return `<aside class="sidebar"><span class="eyebrow">EUER WEG DURCH NOVA</span><nav class="room-nav" aria-label="Räume">${ROOMS.map((r,i)=>`<button class="nav-room ${state.room===i?'active':''}" data-action="room" data-room="${i}" ${!canEnter(i)?'disabled':''} ${state.room===i?'aria-current="step"':''}><span class="nav-number">${state.unlocked[i]?icon('check'):`0${i+1}`}</span><span><strong>${r.short}</strong><small>${state.unlocked[i]?'Entschlüsselt':canEnter(i)?'Zugänglich':'Verschlossen'}</small></span></button>`).join('')}<button class="nav-room ${state.room===4?'active':''}" data-action="room" data-room="4" ${!canEnter(4)?'disabled':''} ${state.room===4?'aria-current="step"':''}><span class="nav-number">${icon('lock')}</span><span><strong>Der Tresor</strong><small>Das Finale</small></span></button></nav><div class="side-help"><p><strong>${esc(state.team||'Team NOVA')}</strong><br>Jeder Hinweis bringt euch weiter. Die Wissensakte ist immer dabei.</p><button class="btn small" data-action="journal">${icon('file')} Ermittlungsakte</button></div></aside>`}
  function timeBox(){return `<div class="time-box"><div><span class="time-label" id="timer-label">VERBLEIBENDE ZEIT</span><span class="timer" id="timer" aria-label="Verbleibende Spielzeit">${timeText(2700-state.elapsed)}</span></div><button class="icon-btn" data-action="pause" aria-label="Spiel pausieren">${icon('pause')}</button></div>`}
  function keysHtml(){return `<div class="keys" aria-label="Gesammelte Tresorschlüssel">${ROOMS.map((r,i)=>`<div class="key-slot ${state.unlocked[i]?'found':''}" aria-label="${r.keyLabel}: ${state.unlocked[i]?r.key:'noch verschlossen'}"><strong>${state.unlocked[i]?r.key:icon('lock')}</strong><span>${state.unlocked[i]?r.keyLabel:'Schlüssel '+(i+1)}</span></div>`).join('')}</div>`}
  function game(){const r=ROOMS[state.room];return `<div class="app-layout">${sidebar()}<main class="game-main" id="main-content"><div class="breadcrumb mono">OPERATION NEUSTART / ${state.room===4?'FINALE':`RAUM 0${state.room+1} VON 04`}</div><div class="game-heading"><div><h1>${r?r.name:'Der letzte Tresor'}</h1><p>${r?r.desc:'Vier Schlüssel. Eine letzte Verbindung. Setzt die Teile zusammen und sichert euren Neustart.'}</p></div>${timeBox()}</div>${r?roomPage(r):vaultPage()}<div class="below-game"><span class="muted">${solvedCount()} / 12 Rätsel gelöst · ${state.unlocked.filter(Boolean).length} / 4 Schlüssel</span><div class="button-row"><button class="btn small" data-action="journal">${icon('file')} Ermittlungsakte</button><button class="btn small ghost" data-action="book">${icon('book')} Wissen nachschlagen</button></div></div></main></div>`}
  function roomPage(r) {
    const count=state.solved[r.id].filter(Boolean).length;
    const fragments=state.fragments[r.id].filter(Boolean).length;
    return `<div class="game-grid"><section aria-label="Raum untersuchen"><div class="room-scene ${state.searchHelp[r.id]?'clue-glow':''} ${count?'is-running':''}">${sceneArt(r.id)}<span class="scene-top mono">NOVA / ${r.short.toUpperCase()} / 0${r.id+1}</span><span class="scene-live"><i></i>${count}/3 MODULE AKTIV</span>${r.spots.map((p,i)=>`<button class="hotspot ${state.solved[r.id][i]?'solved':''}" style="left:${p[0]}%;top:${p[1]}%" data-action="task" data-task="${i}" data-label="${r.objects[i]}" aria-label="${r.objects[i]} untersuchen${state.solved[r.id][i]?' – gelöst':''}">${state.solved[r.id][i]?icon('check'):'0'+(i+1)}</button>`).join('')}${[r.cluePos,SECOND_FRAGMENT[r.id]].map((p,i)=>`<button class="hidden-clue ${state.fragments[r.id][i]?'found':''}" style="left:${p[0]}%;top:${p[1]}%" data-action="clue" data-fragment="${i}" aria-label="Notizfragment ${i===0?'A':'B'} untersuchen" title="Ein abgerissener Zettel"><svg viewBox="0 0 30 32" aria-hidden="true"><path d="M3 2h24v21l-4 3-4-2-4 5-4-2-4 3-4-2Z" fill="${state.fragments[r.id][i]?'#d6e3b6':'#e2c88e'}"/><path d="M7 9h16M7 14h13" stroke="#9d8c61" stroke-width="1.5"/></svg><span class="fragment-tag" aria-hidden="true">${i===0?'A':'B'}</span></button>`).join('')}<div class="scene-bottom"><span>Untersucht die Gegenstände. Findet zwei Zettelfragmente.</span><button class="btn" data-action="search-help" aria-label="Versteckte Notizfragmente hervorheben">${icon('search')}</button></div></div><p class="scene-caption">${fragments}/2 Fragmente gefunden. Kombiniert beide Aussagen am Schloss unter dem Raum.</p>${combinationLock(r.id)}<p class="status-message" id="lock-status" role="status"></p></section><aside aria-label="Gefundene Hinweise"><div class="evidence-panel"><div class="evidence-head"><span class="eyebrow">RAUMAKTE 0${r.id+1}</span><h2>Den Hinweisen folgen.</h2><div class="progress-track" role="progressbar" aria-label="Gelöste Rätsel in diesem Raum" aria-valuenow="${count}" aria-valuemin="0" aria-valuemax="3"><span style="width:${count/3*100}%"></span></div></div><div class="evidence-items">${r.objects.map((o,i)=>`<button class="evidence-item" data-action="task" data-task="${i}"><span class="evidence-symbol">${state.solved[r.id][i]?icon('check'):'0'+(i+1)}</span><span><strong>${o}</strong><small>${state.solved[r.id][i]?r.symbols[i]+' · Karte gesichert':'Noch nicht entschlüsselt'}</small></span><span class="evidence-digit">${state.solved[r.id][i]?r.digits[i]:'–'}</span></button>`).join('')}</div><div class="note-section"><strong>${icon('file')} Notizfragmente · ${fragments}/2</strong>${fragmentList(r.id)}${fragments<2?'<button class="text-button" data-action="search-help">Suchhilfe nutzen</button>':'<p>Beide Aussagen müssen gleichzeitig erfüllt sein.</p>'}</div></div><div class="keys-panel"><h3 class="eyebrow">SCHLÜSSEL FÜR DEN TRESOR</h3>${keysHtml()}</div></aside></div>`;
  }
  function vaultArt(){return `<svg viewBox="0 0 270 280" aria-hidden="true"><path d="m30 33 173-15 40 31v213L65 275l-35-27Z" fill="#587254"/><path d="m30 33 35 29v213l-35-27Z" fill="#79936a"/><path d="m65 62 178-13v213L65 275Z" fill="#405f47"/><path d="m82 77 144-10v178L82 257Z" fill="#8fa77b" stroke="#253f30" stroke-width="6"/><path d="m96 91 117-9v151L96 244Z" fill="#739063" stroke="#afbf93" stroke-width="2"/><ellipse cx="155" cy="159" rx="36" ry="40" fill="#466348" stroke="#bac8a0" stroke-width="5"/><ellipse cx="155" cy="159" rx="11" ry="13" fill="#ccab70"/><path d="M155 128v62m-26-16 52-31m-52 0 52 31" stroke="#d9c18d" stroke-width="6"/><path d="M218 111v28m0 57v28" stroke="#d2deb5" stroke-width="8"/><path d="m112 103 40-3v13l-40 3Z" fill="#d4bb85"/><text x="119" y="112" fill="#6a613e" font-family="monospace" font-size="8">NOVA</text></svg>`}
  function vaultPage() {
    return `<div class="vault-layout ${state.vaultOpen?'':'vault-puzzle'}"><section class="vault-art ${state.vaultOpen?'is-open':''}">${vaultArt()}<span class="eyebrow">DIE LETZTE VERBINDUNG</span><h2>${state.vaultOpen?'Tresor geöffnet.':'Vier Schlüssel. Ein Mechanismus.'}</h2><p>„Folgt zuerst dem Weg der Güter: <strong>einkaufen → herstellen → verkaufen</strong>. Zuletzt kommt das <strong>Dach des Unternehmens</strong>.“</p>${state.vaultOpen?`${keysHtml()}<p style="margin-top:20px"><span class="pill">${icon('check')} Neustart freigegeben</span></p>`:`<p>Setzt die vier beschrifteten Schlüsselkarten in die passenden Fächer. Welche Abteilung übernimmt jeweils den beschriebenen Schritt?</p>${puzzleBoard('vault')}<form id="vault-form"><div class="lock-readout"><div><label class="eyebrow" for="vault-code-display">EURE KOMBINATION</label><output id="vault-code-display">${state.vaultSlots.map(i=>i<0?'·':ROOMS[i].key).join('')}</output></div><button class="btn primary" type="submit">${icon('unlock')} Öffnen</button></div></form><p class="status-message" id="vault-status" role="status"></p>`}</section><section class="final-card"><span class="eyebrow">KLAUSURTRAINING / CA. 10 MINUTEN</span><h2 style="margin-top:9px">Könnt ihr es auch erklären?</h2>${!state.vaultOpen?`<p>Im Tresor liegt der letzte Auftrag: drei kurze Erklärungen, die euer Wissen auf die Probe stellen.</p><div class="divider"></div><p><strong>Fachbegriff nennen.<br>In eigenen Worten erklären.<br>Mit einem Beispiel belegen.</strong></p><p>Öffnet zuerst den Tresor. Anschließend könnt ihr eure Antworten mit Musterlösungen vergleichen.</p>`:reflectionForm()}</section></div>`;
  }
  function reflectionForm(){return `<p>Schreibt zu jedem Auftrag etwa zwei bis vier Sätze. Besprecht im Team, warum eure Erklärung stimmt. Eure Texte werden gespeichert und anschließend <strong>von euch selbst</strong> mit Musterlösungen verglichen.</p><form id="reflection-form">${REFLECTIONS.map((q,i)=>`<label class="writing-label" for="reflection-${i}">${i+1}. ${q.q}</label><textarea id="reflection-${i}" name="reflection-${i}" data-reflection="${i}" maxlength="4000" placeholder="Fachbegriff → Erklärung → Beispiel" ${state.reflectionShown?'readonly':''}>${esc(state.reflections[i])}</textarea>${state.reflectionShown?`<div class="model-answer"><strong>Musterlösung</strong><p>${q.model}</p><label class="self-check"><input type="checkbox" data-self-check="${i}" ${state.selfChecks[i]?'checked':''}>${q.check} Fehlendes haben wir besprochen.</label></div>`:''}`).join('')}<p class="status-message" id="reflection-status" role="status"></p><div class="task-actions">${state.reflectionShown?`<button type="button" class="btn small" data-action="edit-reflections">Antworten ergänzen</button><button type="submit" class="btn primary">Mission abschließen ${icon('check')}</button>`:`<button type="submit" class="btn primary">Mit Musterlösungen vergleichen ${icon('arrow')}</button>`}</div></form>`}
  function reportText(){return `OPERATION NEUSTART – LERNPROTOKOLL\nTeam: ${state.team||'Team NOVA'}\nSpielzeit: ${timeText(state.elapsed)}\nRätsel: ${solvedCount()}/12 · Räume: ${state.unlocked.filter(Boolean).length}/4\n\n${ROOMS.map((r,i)=>`${r.name}: ${r.topic}\n${r.tasks.map((t,j)=>`- ${t.title}: ${state.solved[i][j]?'gelöst':'offen'}, ${state.attempts[i][j]} Versuch(e), Hinweisstufe ${state.hints[i][j]}`).join('\n')}`).join('\n\n')}\n\nKLAUSURTRAINING – SELBSTVERGLEICH\n${REFLECTIONS.map((q,i)=>`${i+1}. ${q.q}\n\nUnsere Antwort:\n${state.reflections[i]}\n\nMusterlösung:\n${q.model}\n\nAbgeglichen: ${state.selfChecks[i]?'ja':'nein'}`).join('\n\n')}\n\nDie freien Antworten wurden selbst anhand der Musterlösungen verglichen, nicht automatisch fachlich bewertet.\nMaterial: Unterrichtsmaterial und bereitgestellter Lernzettel „1. Das Unternehmen“.\n`}
  function endPage(){const hints=state.hints.flat().reduce((a,b)=>a+b,0);return `<main class="end-wrap" id="main-content"><div class="end-header"><div class="success-mark">${icon('check')}</div><span class="eyebrow" style="display:block;margin-top:20px">MISSION ERFÜLLT / ${esc(state.team||'TEAM NOVA')}</span><h1>Das Unternehmen läuft.<br><em class="accent">Euer Wissen auch.</em></h1><p>Ihr habt NOVA wieder auf Kurs gebracht, alle vier Räume entschlüsselt und eure Erklärungen mit den Musterlösungen abgeglichen.</p></div><div class="end-stats"><div class="end-stat"><strong>12 / 12</strong><span>Rätsel gelöst</span></div><div class="end-stat"><strong>${timeText(state.elapsed)}</strong><span>aktive Spielzeit</span></div><div class="end-stat"><strong>3 / 3</strong><span>Erklärungen selbst geprüft</span></div></div><h2>Das nehmt ihr in die Klausur mit.</h2>${ROOMS.map((r,i)=>{const support=state.hints[i].some(n=>n>0)||state.attempts[i].some(n=>n>1);return `<div class="review-topic"><strong>${r.topic}</strong><span>${support?'Noch einmal ohne Hilfe erklären':'Beim ersten Versuch gelöst'}</span></div>`}).join('')}<p class="micro" style="margin:18px 0">${hints} fachliche Hinweisstufe${hints===1?'':'n'} genutzt. Hinweise sind Lernhilfen und kosten keine Punkte. Die freien Antworten wurden selbst verglichen; es wurde keine Note vergeben.</p><div class="button-row"><button class="btn primary" data-action="download">${icon('download')} Lernprotokoll speichern</button><button class="btn" data-action="print">${icon('print')} Drucken</button><button class="btn" data-action="review-final">Antworten ansehen</button></div><div class="divider"></div><div class="button-row"><button class="text-button" data-action="book">Wissensakte öffnen</button><button class="text-button" data-action="reset">Neue Mission starten</button></div><section class="print-only"><h2>Unsere Erklärungen und Musterlösungen</h2>${REFLECTIONS.map((q,i)=>`<h3>${i+1}. ${q.q}</h3><p><strong>Unsere Antwort:</strong><br>${esc(state.reflections[i]).replace(/\n/g,'<br>')}</p><p><strong>Musterlösung:</strong><br>${q.model}</p>`).join('')}</section></main>`}
  function render(){pickedToken=null;applyMotion();const active=document.activeElement;$('#app').innerHTML=state.view==='landing'?landing():state.view==='end'?endPage():game();updateTimer();if(active&&active!==document.body&&!active.isConnected&&!$('#modal').open){const target=$('#main-content h1');if(target){target.tabIndex=-1;target.focus({preventScroll:true})}}}
  function setup(){if(state.started){state.view=state.completed?'end':'game';lastTick=Date.now();save();render();return}openModal('EINSATZBESPRECHUNG',`<h2 id="modal-title">Willkommen bei NOVA.</h2><p class="intro">Ein Systemfehler hat das Unternehmen lahmgelegt. Ihr seid das Rettungsteam. Sichert die vier Bereichsschlüssel und öffnet den Tresor für den Neustart.</p><ol class="setup-steps"><li><b>1</b><div><strong>Untersucht jeden Raum.</strong><p>Klickt oder tippt auf die nummerierten Gegenstände. Sucht außerdem zwei kleine Notizfragmente.</p></div></li><li><b>2</b><div><strong>Knackt die Türcodes.</strong><p>Drei gelöste Rätsel liefern Ziffernkarten. Kombiniert die Aussagen beider Notizfragmente und ordnet die Karten am Schloss.</p></div></li><li><b>3</b><div><strong>Sichert euer Wissen.</strong><p>Im Finale schreibt ihr drei kurze Erklärungen und vergleicht sie mit Musterlösungen.</p></div></li></ol><form id="setup-form"><label for="team-name" class="eyebrow">EUER TEAMNAME (OPTIONAL)</label><input id="team-name" class="team-field" maxlength="40" placeholder="Zum Beispiel: Die Geschäftsführung" autocomplete="off"><p class="micro">Am besten zu zweit oder zu dritt an einem Gerät. Die 45 Minuten sind eine Orientierung; ihr könnt auch danach weiterspielen. Wissensakte und Hinweise sind jederzeit erlaubt.</p><button class="btn primary" type="submit">Gebäude betreten ${icon('arrow')}</button></form>`,{type:'setup'})}
  function help() {
    openModal('SPIELANLEITUNG',`<h2 id="modal-title">Suchen. Kombinieren. Ausprobieren.</h2><div class="how-it-works"><div><h3>01 / Gegenstände untersuchen</h3><p>Drei nummerierte Gegenstände öffnen Aufgaben. Löst sie und sammelt die zugehörigen Ziffernkarten.</p></div><div><h3>02 / Spuren kombinieren</h3><p>In jedem Raum liegen zwei kleine Zettelfragmente. Erst beide Aussagen zusammen verraten die eindeutige Kartenreihenfolge für das Türschloss.</p></div><div><h3>03 / Karten bewegen</h3><p>Zieht Karten in Fächer oder wählt zuerst eine Karte und tippt anschließend das Zielfeld an. Belegte Fächer tauschen die Karten; beim Förderband wird die Karte einsortiert.</p></div><div><h3>04 / Den Tresor öffnen</h3><p>Jede Tür liefert eine Schlüsselkarte. Kombiniert die vier Schlüssel mithilfe der Funktionsbereiche. Danach folgt euer Klausurtraining.</p></div></div><div class="divider"></div><p><strong>Auf Touchscreens:</strong> Zieht am Griff ⠿. Auf dem übrigen Teil der Karte könnt ihr normal scrollen oder die Karte antippen. Beim Ziehen an den oberen oder unteren Fensterrand wird automatisch gescrollt.</p><p><strong>Mit Tastatur:</strong> Mit Tab zu Karte und Zielfeld, mit Enter oder Leertaste auswählen und ablegen. Beim Förderband gibt es zusätzlich Pfeiltasten. Escape hebt eine Kartenauswahl auf oder schließt den Dialog.</p><p><strong>Wenn ihr feststeckt:</strong> Nutzt die Wissensakte, die drei Hinweisstufen der Aufgaben oder die Kombinationshilfe am Türschloss. Es gibt keinen Punktabzug.</p><p><strong>45 Minuten:</strong> Die Uhr lässt sich pausieren. Nach Ablauf der Zeit könnt ihr weiterarbeiten. Euer Fortschritt wird lokal im Browser gespeichert.</p><div class="motion-preference"><button class="btn" data-action="motion" aria-pressed="${state.motion}">${state.motion?'Animationen ausschalten':'Animationen einschalten'}</button><p>Die Einstellung eures Geräts für reduzierte Bewegung wird zusätzlich beachtet.</p></div>`,{type:'help'});
  }
  function openBook(tab=bookTab){bookTab=tab;const prior=modalContext?.type==='task'?{r:modalContext.r,t:modalContext.t}:modalContext?.returnTask;openModal('WISSENSAKTE / NACHSCHLAGEN ERLAUBT',`<h2 id="modal-title">Alles, was ihr wissen müsst.</h2><div class="book-tabs" role="group" aria-label="Wissensthemen">${BOOK.map((b,i)=>`<button data-action="book-tab" data-tab="${i}" class="${i===tab?'active':''}" aria-pressed="${i===tab}">${b.name}</button>`).join('')}</div><div class="book-content">${BOOK[tab].html}</div>${prior?`<div class="task-actions"><button class="btn primary" data-action="return-task">${icon('back')} Zurück zum Rätsel</button></div>`:''}<p class="source-tag">Grundlage: das bereitgestellte Unterrichtsmaterial und der Lernzettel „1. Das Unternehmen“. Die Texte sind für das Spiel zusammengefasst.</p>`,{type:'book',returnTask:prior})}
  function journal() {
    openModal('ERMITTLUNGSAKTE',`<h2 id="modal-title">Eure gesicherten Spuren.</h2><p>Hier bleiben alle Ziffernkarten, Notizfragmente und Tresorschlüssel gesammelt.</p>${ROOMS.map((r,i)=>`<section class="journal-room"><h3>0${i+1} / ${r.name}</h3><div class="journal-digits">${r.symbols.map((s,j)=>`<span>${s}: <strong>${state.solved[i][j]?r.digits[j]:'?'}</strong></span>`).join('')}</div>${fragmentList(i)}${state.unlocked[i]?`<p><strong>Tresorschlüssel: ${r.keyLabel} = ${r.key}</strong></p>`:''}</section>`).join('')}`,{type:'journal'});
  }
  const draftKey=(r,t)=>`${r}-${t}`;
  function getDraft(r,t) {
    const key=draftKey(r,t),task=ROOMS[r].tasks[t];
    if(task.kind==='ledger') {
      const d=state.drafts[key];
      if(!d||typeof d!=='object'||!Array.isArray(d.groups)||d.groups.length!==RECEIPTS.length)state.drafts[key]={groups:state.solved[r][t]?RECEIPTS.map(x=>x.group):RECEIPTS.map(()=>-1),profit:typeof d==='string'?d:state.solved[r][t]?'3000':''};
    }else if(state.drafts[key]===undefined) {
      state.drafts[key]=task.kind==='multi'?[]:['match','house'].includes(task.kind)?task.rows.map(()=>-1):task.kind==='order'?task.items.map((_,i)=>i):task.kind==='choice'?-1:'';
    }
    return state.drafts[key];
  }
  function taskFields(r,t) {
    const task=ROOMS[r].tasks[t],draft=getDraft(r,t),done=state.solved[r][t],disabled=done?'disabled':'';
    if(task.kind==='house')return puzzleBoard(`house:${r}:${t}`);
    if(task.kind==='order')return puzzleBoard(`flow:${r}:${t}`);
    if(task.kind==='ledger')return `${puzzleBoard(`ledger:${r}:${t}`)}<label class="task-question" for="task-number">Was bleibt als Gewinn?</label><div class="number-field"><input type="text" inputmode="numeric" id="task-number" value="${esc(draft.profit)}" placeholder="Euer Ergebnis" maxlength="12" ${disabled}><span>€ Gewinn</span></div><p class="micro" style="margin-top:7px">Gebt den Betrag ohne Tausendertrennzeichen ein.</p>`;
    if(task.kind==='choice'||task.kind==='multi')return `<fieldset class="choices" ${disabled}><legend class="sr-only">${task.question}</legend>${task.options.map((o,i)=>`<label class="choice"><input type="${task.kind==='multi'?'checkbox':'radio'}" name="task-choice" value="${i}" ${task.kind==='multi'?(draft.includes(i)?'checked':''):(draft===i?'checked':'')}> <span>${o}</span></label>`).join('')}</fieldset>`;
    if(task.kind==='match')return `<fieldset ${disabled}><legend class="sr-only">${task.question}</legend>${task.rows.map((row,i)=>`<div class="match-row"><label for="match-${i}">${row}</label><select id="match-${i}" data-match="${i}"><option value="-1">Bitte zuordnen …</option>${task.options.map((o,j)=>`<option value="${j}" ${draft[i]===j?'selected':''}>${o}</option>`).join('')}</select></div>`).join('')}</fieldset>`;
    return `<div class="number-field"><label class="sr-only" for="task-number">Gewinn in Euro</label><input type="text" inputmode="numeric" id="task-number" value="${esc(draft)}" placeholder="Euer Ergebnis" maxlength="12" ${disabled}><span>${task.unit}</span></div>`;
  }
  function successFeedback(r,t){const room=ROOMS[r],task=room.tasks[t];return `<div class="feedback success" role="status"><strong>${icon('check')} Rätsel gelöst.</strong><p>${task.explanation}</p><div class="reward"><strong>${room.digits[t]}</strong><span><b>${room.symbols[t]}</b><br>Diese Ziffer ist in eurer Ermittlungsakte gesichert.</span></div></div>`}
  function openTask(t,r=state.room){const task=ROOMS[r].tasks[t],done=state.solved[r][t];openModal(`RAUM 0${r+1} / ${ROOMS[r].objects[t]}`,`<h2 id="modal-title">${task.title}</h2><div class="task-story">${task.story}</div>${task.table?STAT_TABLE:''}<p class="task-question">${task.question}</p><form id="task-form">${taskFields(r,t)}<div id="task-feedback">${done?successFeedback(r,t):''}</div><div id="task-hint">${hintHtml(r,t)}</div><div class="task-actions">${done?`<button type="button" class="btn primary" data-action="close">Zurück in den Raum ${icon('arrow')}</button>`:`<button class="btn primary" type="submit">Antwort prüfen ${icon('arrow')}</button><button type="button" class="btn" data-action="hint" ${state.hints[r][t]>=3?'disabled':''}>${icon('bulb')} Hinweis ${Math.min(state.hints[r][t]+1,3)}/3</button>`}</div></form><p class="source-tag">${ROOMS[r].source} · <button class="text-button" data-action="book">Wissensakte öffnen</button></p>`,{type:'task',r,t})}
  function hintHtml(r,t){const n=state.hints[r][t];return n?`<div class="hint-box" role="status"><strong>Hinweis ${n} von 3</strong><p>${ROOMS[r].tasks[t].hints[n-1]}</p></div>`:''}
  function isCorrect(task,draft) {
    if(task.kind==='ledger')return RECEIPTS.every((receipt,i)=>draft.groups[i]===receipt.group)&&/^-?\d+$/.test(String(draft.profit).trim())&&Number(draft.profit)===task.answer;
    if(task.kind==='multi')return Array.isArray(draft)&&draft.length===task.answer.length&&task.answer.every(n=>draft.includes(n));
    if(['match','house','order'].includes(task.kind))return Array.isArray(draft)&&draft.length===task.answer.length&&task.answer.every((n,i)=>draft[i]===n);
    if(task.kind==='number')return /^-?\d+$/.test(String(draft).trim())&&Number(draft)===task.answer;
    return draft===task.answer;
  }
  function isComplete(task,draft) {
    if(task.kind==='ledger')return draft.groups.every(n=>n>=0)&&String(draft.profit).trim().length>0;
    if(task.kind==='multi')return draft.length>0;
    if(['match','house'].includes(task.kind))return draft.every(n=>n>=0);
    if(task.kind==='choice')return draft>=0;
    if(task.kind==='number')return String(draft).trim().length>0;
    return true;
  }
  function checkTask(){const {r,t}=modalContext,task=ROOMS[r].tasks[t],draft=getDraft(r,t);if(state.solved[r][t])return;if(!isComplete(task,draft)){$('#task-feedback').innerHTML='<div class="feedback" role="status">Bitte bearbeitet zuerst alle Teile der Aufgabe.</div>';return}state.attempts[r][t]++;if(isCorrect(task,draft)){state.solved[r][t]=true;save();render();openTask(t,r);announce('Rätsel gelöst. '+ROOMS[r].symbols[t]+': '+ROOMS[r].digits[t])}else{save();$('#task-feedback').innerHTML=`<div class="feedback is-wrong" role="status"><strong>Noch nicht ganz.</strong><p>${task.wrong}</p><p>Prüft eure Auswahl oder nutzt einen Hinweis.</p></div>`}}
  function showHint(){const {r,t}=modalContext;if(state.hints[r][t]>=3)return;state.hints[r][t]++;save();$('#task-hint').innerHTML=hintHtml(r,t);const b=$('[data-action="hint"]');b.innerHTML=`${icon('bulb')} Hinweis ${Math.min(state.hints[r][t]+1,3)}/3`;b.disabled=state.hints[r][t]>=3}
  function clue(part=0) {
    const r=ROOMS[state.room];
    if(part!==0&&part!==1)return;
    state.fragments[r.id][part]=true;state.clues[r.id]=state.fragments[r.id].every(Boolean);save();render();
    openModal('NOTIZFRAGMENT '+(part===0?'A':'B')+' GEFUNDEN',`<h2 id="modal-title">Eine Spur allein reicht nicht.</h2><div class="clue-note">${FRAGMENTS[r.id][part]}</div><p>${state.clues[r.id]?'Ihr habt beide Fragmente. Welche einzige Kartenreihenfolge erfüllt beide Aussagen?':'Ein zweiter Zettel im Raum ergänzt diese Aussage. Sucht ihn und kombiniert beide Hinweise.'}</p><p class="micro">Das Fragment ist in eurer Raumakte und Ermittlungsakte gesichert.</p><button class="btn primary" data-action="close">Zurück in den Raum ${icon('arrow')}</button>`,{type:'clue'});
  }
  function checkDoor() {
    const r=ROOMS[state.room],v=state.doorSlots[r.id];
    if(!state.solved[r.id].every(Boolean)){$('#lock-status').textContent='Sichert zuerst alle drei Ziffernkarten, indem ihr die Rätsel löst.';return}
    if(!state.fragments[r.id].every(Boolean)){$('#lock-status').textContent='Eines oder beide Notizfragmente fehlen noch. Findet sie, um die Reihenfolge zu entschlüsseln.';return}
    if(v.some(i=>i<0)){$('#lock-status').textContent='Legt die drei Ziffernkarten in die drei Fächer des Schlosses.';return}
    state.lockAttempts[r.id]++;
    if(!r.order.every((i,pos)=>v[pos]===i)){
      save();$('#lock-status').textContent='Diese Reihenfolge erfüllt noch nicht beide Hinweise. Prüft die Position jeder Karte.';
      const lock=$('.logic-lock');lock.classList.remove('is-wrong');void lock.offsetWidth;lock.classList.add('is-wrong');return;
    }
    state.unlocked[r.id]=true;save();render();
    openModal(`RAUM 0${r.id+1} ENTSCHLÜSSELT`,`<h2 id="modal-title">Die Kombination stimmt.</h2>${unlockAnimation()}<p>Beide Spuren passen zusammen. Hinter der geöffneten Tür liegt euer Schlüssel für den letzten Tresor.</p><div class="room-key-found">${icon('key')}<strong>${r.key}</strong><p><b>${r.keyLabel}</b><br>Diese Schlüsselkarte ist in der Ermittlungsakte gespeichert.</p></div><button class="btn primary" data-action="next-room">${r.id<3?'Nächsten Raum betreten':'Zum letzten Tresor'} ${icon('arrow')}</button>`,{type:'unlocked',r:r.id});
    announce('Tür geöffnet. Tresorschlüssel '+r.keyLabel+': '+r.key);
  }
  function checkVault() {
    if(!state.unlocked.every(Boolean))return;
    if(state.vaultSlots.some(i=>i<0)){$('#vault-status').textContent='Legt zuerst alle vier Schlüsselkarten in die Fächer.';return}
    state.finalAttempts++;
    if(![2,1,3,0].every((n,i)=>state.vaultSlots[i]===n)){save();$('#vault-status').textContent='Denkt an Beschaffung → Produktion → Absatz → Leitung. Welcher Begriff gehört zu welchem Schritt?';return}
    state.vaultOpen=true;save();render();
    openModal('NOVA / NEUSTART FREIGEGEBEN',`<h2 id="modal-title">Der Tresor ist offen.</h2>${unlockAnimation()}<p>Ihr habt den Weg der Güter und das Dach des Unternehmens richtig verbunden. Jetzt sichert ihr euer Wissen mit drei kurzen Erklärungen.</p><button class="btn primary" data-action="close-vault">Zum Klausurtraining ${icon('arrow')}</button>`,{type:'vault-open'});
    announce('Tresor geöffnet. Das Klausurtraining ist jetzt zugänglich.');
  }
  function checkReflections(){if(!state.vaultOpen)return;if(!state.reflectionShown){if(state.reflections.some(t=>t.trim().length<40)){$('#reflection-status').textContent='Formuliert zu jeder Aufgabe eine kurze Erklärung (mindestens 40 Zeichen). Anschließend könnt ihr sie selbst vergleichen.';return}state.reflectionShown=true;save();render();$('#reflection-form')?.scrollIntoView({behavior:'smooth',block:'start'});announce('Musterlösungen eingeblendet. Vergleicht eure Texte selbst und bestätigt die drei Kriterien.')}else{if(!state.selfChecks.every(Boolean)){$('#reflection-status').textContent='Vergleicht alle drei Antworten mit den Kriterien und bestätigt den Abgleich. Ergänzt bei Bedarf eure Antworten.';return}state.completed=true;state.view='end';save();render();window.scrollTo(0,0)}}
  function pause(){if(!state.started||state.completed)return;paused=true;document.body.classList.add('paused');openModal('PAUSE',`<h2 id="modal-title">Kurz durchatmen.</h2><p>Die Uhr steht still. Euer Fortschritt ist gespeichert.</p><button class="btn primary" data-action="close">${icon('play')} Mission fortsetzen</button>`,{type:'pause'})}
  function resetPrompt(){openModal('NEUE MISSION',`<h2 id="modal-title">Noch einmal von vorn?</h2><p>Damit löscht ihr den Spielstand dieses Browsers – einschließlich eurer Antworten. Speichert vorher euer Lernprotokoll, wenn ihr es behalten möchtet.</p><div class="button-row">${state.started?`<button class="btn" data-action="download">${icon('download')} Protokoll sichern</button>`:''}<button class="btn orange" data-action="confirm-reset">Spielstand löschen</button><button class="btn" data-action="close">Abbrechen</button></div>`,{type:'reset'})}
  function download(){const blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='NOVA-Lernprotokoll.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  function updateTimer(){const timer=$('#timer');if(timer){timer.textContent=state.elapsed>=2700?'+'+timeText(state.elapsed-2700):timeText(2700-state.elapsed);timer.style.color=state.elapsed>=2700?'var(--orange)':'';$('#timer-label').textContent=state.elapsed>=2700?'LERNZEIT VERLÄNGERT':'VERBLEIBENDE ZEIT';timer.setAttribute('aria-label',state.elapsed>=2700?'Zusätzliche Lernzeit':'Verbleibende Spielzeit')}}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action;if(action==='home'){if($('#modal').open)closeModal();state.view='landing';save();render()}else if(action==='setup')setup();else if(action==='help')help();else if(action==='book')openBook();else if(action==='book-tab')openBook(Number(b.dataset.tab));else if(action==='return-task'){const p=modalContext.returnTask;if(p)openTask(p.t,p.r)}else if(action==='room')goRoom(Number(b.dataset.room));else if(action==='task')openTask(Number(b.dataset.task));else if(action==='hint')showHint();else if(action==='close')closeModal();else if(action==='clue')clue(Number(b.dataset.fragment));else if(action==='journal')journal();else if(action==='pause')pause();else if(action==='next-room'){const r=modalContext.r;closeModal();goRoom(r+1)}else if(action==='search-help'){state.searchHelp[state.room]=true;save();render();announce('Die Notizfragmente sind jetzt orange umrandet.');$('.hidden-clue:not(.found)')?.focus()}else if(action==='reset')resetPrompt();else if(action==='confirm-reset'){closeModal();state=blankState();paused=false;lastTick=Date.now();save();render()}else if(action==='download')download();else if(action==='print')window.print();else if(action==='edit-reflections'){state.reflectionShown=false;state.selfChecks=[false,false,false];save();render()}else if(action==='review-final'){state.view='game';state.room=4;save();render()}});
  document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='setup-form'){state.started=true;state.team=$('#team-name').value.trim();state.view='game';lastTick=Date.now();closeModal();save();render()}else if(e.target.id==='task-form')checkTask();else if(e.target.id==='door-form')checkDoor();else if(e.target.id==='vault-form')checkVault();else if(e.target.id==='reflection-form')checkReflections()});
  document.addEventListener('change',e=>{if(e.target.closest('#task-form')&&modalContext?.type==='task'){const {r,t}=modalContext,key=draftKey(r,t),task=ROOMS[r].tasks[t];if(state.solved[r][t])return;if(task.kind==='multi')state.drafts[key]=Array.from(document.querySelectorAll('[name="task-choice"]:checked'),i=>Number(i.value));else if(task.kind==='choice')state.drafts[key]=Number(e.target.value);else if(task.kind==='match'&&e.target.dataset.match!==undefined)getDraft(r,t)[Number(e.target.dataset.match)]=Number(e.target.value);save()}if(e.target.dataset.selfCheck!==undefined){state.selfChecks[Number(e.target.dataset.selfCheck)]=e.target.checked;save()}});
  document.addEventListener('input',e=>{if(e.target.id==='task-number'&&modalContext?.type==='task'){const {r,t}=modalContext;if(ROOMS[r].tasks[t].kind==='ledger')getDraft(r,t).profit=e.target.value;else state.drafts[draftKey(r,t)]=e.target.value;save()}if(e.target.dataset.reflection!==undefined){state.reflections[Number(e.target.dataset.reflection)]=e.target.value;save()}});
  $('#close-modal').innerHTML=icon('close');$('#close-modal').addEventListener('click',closeModal);$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
  document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));$('#brand-icon').innerHTML=icon('factory');
  setInterval(()=>{const now=Date.now();if(state.started&&state.view==='game'&&!state.completed&&!paused){const previous=state.elapsed;state.elapsed+=(now-lastTick)/1000;updateTimer();if(previous<2700&&state.elapsed>=2700)announce('Die 45 Minuten sind vorbei. Ihr könnt ohne Einschränkung weiterarbeiten.');if(++tickCount%5===0)save()}lastTick=now},1000);
  window.addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
  render();
</script>
</body>
</html>
